name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签（仅用于发布标识，不改变插件版本号）。留空则仅打包'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$(echo "$INPUT_TAG" | xargs)"
          if [ -z "$TAG" ]; then
            exit 0
          fi
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "::error::非法 tag：$TAG（仅允许字母、数字、. _ + -）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin

      - name: Upload artifact (test build)
        if: inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: jrebel-license-server-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # 已存在同名 release/tag 时覆盖：删除旧 release（含 tag）后重建。
          gh release delete "$TAG" --yes --cleanup-tag || true
          git tag -f "$TAG"
          git push -f origin "$TAG"
          gh release create "$TAG" build/distributions/*.zip \
            --title "$TAG" \
            --generate-notes
