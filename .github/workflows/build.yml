name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签（仅用于发布标识，不改变插件版本号）。留空则仅打包'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$(echo "$INPUT_TAG" | xargs)"
          if [ -z "$TAG" ]; then
            exit 0
          fi
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "::error::非法 tag：$TAG（仅允许字母、数字、. _ + -）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build plugin (modern, 2022.3+)
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin

      - name: Build plugin (legacy, 2021.2–2022.2)
        run: |
          chmod +x gradlew
          ./gradlew -p legacy buildPlugin

      - name: Upload artifact (test build)
        if: inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: jrebel-license-server-plugin
          path: |
            build/distributions/*.zip
            legacy/build/distributions/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## 安装包选择

          同一版本提供两个安装包，功能完全一致，只是兼容的 IDE 版本不同：

          | 安装包 | 适配 IDE 版本 | 编译基线 / 字节码 |
          | --- | --- | --- |
          | `jrebel-license-server-idea-plugin-<version>.zip` | IntelliJ IDEA 2022.3（build 223）及以上 | 2023.3.4 / Java 17 |
          | `jrebel-license-server-idea-plugin-legacy-<version>.zip` | IntelliJ IDEA 2021.2 – 2022.2（build 212–222.*） | 2021.3.3 / Java 11 |

          ### 如何选择

          - **IntelliJ IDEA 2022.3 及更新版本**：下载新版包（文件名中不含 `legacy`）。
          - **IntelliJ IDEA 2021.2 – 2022.2**：下载 `legacy` 包。

          ### 安装

          1. `Settings` → `Plugins` → 齿轮菜单 → `Install Plugin from Disk...`
          2. 选择对应 zip 并重启 IDE。
          3. 使用前需在同一 IDE 中安装官方 JRebel 插件。

          > 插件版本号固定用于界面显示；安装时不校验版本高低，允许直接覆盖已安装版本。
          EOF

          # 已存在同名 release/tag 时覆盖：删除旧 release（含 tag）后重建。
          gh release delete "$TAG" --yes --cleanup-tag || true
          git tag -f "$TAG"
          git push -f origin "$TAG"
          gh release create "$TAG" build/distributions/*.zip legacy/build/distributions/*.zip \
            --title "JRebel License Server $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
